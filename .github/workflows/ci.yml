name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: smoke-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Link binary
        run: sudo npm link

      - name: Verify CLI is on PATH
        run: |
          which repo-inv
          which repo-inv-mcp
          repo-inv --help | head -20

      - name: Install lightweight analyzers
        run: |
          pip install --user semgrep lizard radon vulture bandit
          npm install -g jscpd madge
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: repo-inv tools (inventory)
        run: repo-inv tools | tee /tmp/tools.txt

      - name: repo-inv manifest (must be valid JSON)
        run: repo-inv manifest | jq -e '.commands | length >= 14'

      - name: install-mcp --dry-run regression (no secret dump)
        run: |
          out=$(repo-inv install-mcp copilot --dry-run)
          echo "$out"
          echo "$out" | grep -q '"command": "node"'
          echo "$out" | grep -q 'preserved untouched'

      - name: Self-analyze (arch layer only, fast)
        run: |
          repo-inv analyze . --layer arch -o /tmp/self-report
          test -f /tmp/self-report/report.json
          jq -e '.schema == "repo-inv/report@1"' /tmp/self-report/report.json
